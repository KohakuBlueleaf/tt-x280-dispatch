name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install black ruff pytest clang-format matplotlib

      - name: Python format and lint
        run: |
          black --check src bench scripts tests
          ruff check src bench scripts tests

      - name: C/C++ format
        run: find src -name '*.cpp' -o -name '*.hpp' -o -name '*.c' | xargs clang-format --dry-run -Werror

      - name: Offline tests
        run: python -m pytest -q tests

      - name: Figures build
        run: |
          cd scripts/docs
          python plots.py /tmp/assets
          python diagrams.py /tmp/assets
